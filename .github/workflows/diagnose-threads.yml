# =============================================================================
# TEMPORARY, SINGLE-SHOT. Delete once it has answered.
# =============================================================================
# Does the reference output depend on the number of visible cores?
#
# The gate failure is flaky, roughly half the runs, and takes exactly TWO values
# (da0bafdf/0e3964c7 or 3ab5ad90/4a89f1e3) and never a third. Two stable values
# across identical builds is the signature of two thread counts, not of noise:
# OpenBLAS sizes its thread pool from the visible core count and a threaded
# reduction sums in a different order than a serial one.
#
# Rather than run CI repeatedly and hope successive runners differ -- which is
# what makes this expensive -- vary the core count directly with --cpuset-cpus
# inside ONE job. That is the actual independent variable.
#
#   Part 1  build 7's published image, unpinned, at 1/2/4 cores.
#           Different hashes by core count => mechanism confirmed.
#   Part 2  the current image, with the thread pin, at the same core counts.
#           Identical hashes => the pin fixes it, and part 2 prints the value
#           the baseline must be updated to.
#
# One run answers the diagnosis AND the verification AND supplies the new
# baseline. Publishes nothing.
# =============================================================================

name: diagnose-threads

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diagnose-threads.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  threads:
    runs-on: ubuntu-latest
    env:
      B7: ghcr.io/jonathancrawford05/r-gam-base@sha256:774803b941bb435e4826fcac12dfbc131e94da19428d6c22a825c0edf15be3c8
    steps:
      - uses: actions/checkout@v4

      - name: Host
        run: |
          echo "nproc: $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true

      - name: Part 1 - build 7's image (no thread pin) by core count
        run: |
          set -euo pipefail
          for cpus in 0 0-1 0-3; do
            rm -rf o; mkdir -p o
            docker run --rm --cpuset-cpus="$cpus" -v "$PWD/o:/work/out" "$B7" \
              Rscript /opt/oracle/run.R --out /work/out >/dev/null 2>&1
            n=$(docker run --rm --cpuset-cpus="$cpus" "$B7" nproc)
            printf 'cpuset %-4s (nproc %s)  %s\n' "$cpus" "$n" \
              "$(sha256sum o/binomial_logit_tp.json | cut -c1-16)"
          done

      - uses: docker/setup-buildx-action@v3

      - name: Build the current image (thread pin in the Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: oracle-pinned:candidate

      - name: Part 2 - the pinned image by core count
        run: |
          set -euo pipefail
          for cpus in 0 0-1 0-3; do
            rm -rf p; mkdir -p p
            docker run --rm --cpuset-cpus="$cpus" -v "$PWD/p:/work/out" \
              oracle-pinned:candidate Rscript /opt/oracle/run.R --out /work/out >/dev/null 2>&1
            n=$(docker run --rm --cpuset-cpus="$cpus" oracle-pinned:candidate nproc)
            printf 'cpuset %-4s (nproc %s)  %s  %s\n' "$cpus" "$n" \
              "$(sha256sum p/binomial_logit_tp.json | cut -c1-16)" \
              "$(sha256sum p/gaussian_tp_cr.json    | cut -c1-16)"
          done
          echo
          echo "### full hashes for the new baseline (pinned image)"
          sha256sum p/binomial_logit_tp.json p/gaussian_tp_cr.json

      - name: Verdict
        run: |
          set -euo pipefail
          echo "Part 1 hashes differing by core count  => threads are the cause."
          echo "Part 2 hashes identical across core counts => the pin fixes it,"
          echo "and catalog/expected-hashes.json must be updated to the values above."
