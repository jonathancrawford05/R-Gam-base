name: publish

on:
  push:
    # Feature branches build and selftest but never publish; see the PUBLISH
    # gate below.
    branches: [main, "claude/**"]
    # The publish job commits the generated catalog back to main. Without this
    # that commit retriggers the workflow, which publishes, which commits --
    # forever. Documentation is excluded for the same reason it cannot change
    # the image: none of it is a Docker build input.
    #
    # Never add Dockerfile, oracle/** or the R scripts the Dockerfile COPYs.
    paths-ignore:
      - "**/*.md"
      - "catalog/**"
      - "LICENSE"
  pull_request:
  # Monthly rebuild. It moves nothing: the base is digest-pinned and CRAN is
  # snapshot-pinned, so this cannot pull in base-OS patches either. What it
  # proves is that the pinned snapshot is still resolvable and the image still
  # builds - early warning that a pin has rotted. Picking up OS patches means
  # bumping BASE_DIGEST, which is a deliberate commit.
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write   # the publish job commits the generated catalog
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a run that might be publishing. Pushing the image tag and
  # recording the build are two steps with no transaction around them: a
  # cancel landing between them leaves a tag in the registry with no catalog record,
  # which silently consumes a build number and wedges the next publish until
  # someone hand-edits the file. Branch and PR runs publish nothing, so they stay
  # cancellable and keep saving the CI minutes this setting was added for.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    runs-on: ubuntu-latest
    # Publishing requires BOTH a publishing event AND the default branch.
    # Everything else builds and tests without pushing, so a feature branch can
    # prove the image is sound without moving a tag.
    #
    # The ref condition is not decoration. This job pushes image tags and commits
    # the catalog back with `git push origin HEAD:main`. A workflow_dispatch from a
    # feature branch would put HEAD on that branch, and the rebase-and-push would
    # carry every commit on it onto main -- merging unreviewed work with no PR,
    # or, if main is protected, failing AFTER the image tag was already pushed and
    # leaving exactly the tag/catalog desync the guard exists to prevent.
    # `schedule` only ever runs on the default branch, so this costs it nothing.
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main'
        && (github.event_name == 'schedule'
            || github.event_name == 'workflow_dispatch'
            || github.event_name == 'push') }}
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile is the single source of truth for the pinned versions;
      # the workflow reads them rather than restating them, so they cannot drift.
      - name: Resolve image coordinates
        id: meta
        run: |
          set -euo pipefail
          r_version=$(sed -n 's/^ARG R_VERSION=//p' Dockerfile | head -1)
          snapshot=$(sed -n 's/^ARG CRAN_SNAPSHOT=//p' Dockerfile | head -1)
          # GHCR requires a lowercase path; this repository is "R-Gam-base".
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # The build number is what makes a tag unique when the version fields
          # cannot: two builds with the same R and the same snapshot are still two
          # builds. catalog/builds/*.json is the source of truth rather than the
          # registry, so the catalog can never fall behind the tag it describes.
          last=$(python3 scripts/catalog.py max-build)
          build_number=$(( last + 1 ))
          tag="r${r_version}-cran${snapshot}-b${build_number}"
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          {
            echo "image=$image"
            echo "r_version=$r_version"
            echo "snapshot=$snapshot"
            echo "build_number=$build_number"
            echo "tag=$tag"
            echo "created=$created"
            echo "float_tag=r${r_version}-latest"
          } >> "$GITHUB_OUTPUT"
          echo "resolved build $build_number -> $image:$tag"

      # Log in first: the tag guard must query the registry with credentials, so
      # that an auth failure is a distinguishable error rather than a 401 it
      # might mistake for something else.
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are immutable and never reused. This is FAIL-CLOSED: it publishes
      # only on a definite 404. `docker manifest inspect` was rejected here
      # because it exits non-zero for "absent", "unauthorised", "rate limited"
      # and "network died" alike -- so the one time the registry is unreachable
      # it would report the tag as free and quietly move it.
      - name: Refuse to reuse an existing tag
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Actions runs `run:` under `bash -e`, and `set -uo pipefail` does not
          # clear the inherited -e. Without `set +e` the script's non-zero exit
          # aborts the step here, `rc=$?` never runs, and every message below is
          # dead code: the step still fails, but the operator is told nothing
          # about which failure it was or how to recover.
          set +e
          bash scripts/check-tag-free.sh \
            '${{ steps.meta.outputs.image }}' '${{ steps.meta.outputs.tag }}'
          rc=$?
          set -e
          case "$rc" in
            0)  echo "tag is free; proceeding" ;;
            10) echo "::error title=Tag already exists::${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
          is already published. Tags are immutable and are never re-pointed. Add the missing \
          record under catalog/builds/ so the build number advances, then re-run."
                exit 1 ;;
            *)  echo "::error title=Cannot verify tag state::The registry did not give a definite \
          answer for ${{ steps.meta.outputs.tag }}. Refusing to publish: treating an unreachable \
          registry as 'tag is free' is how an immutable tag silently moves."
                exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@v3

      # Build and load locally first. The image is tested before it is pushed,
      # and the bytes that pass the test are the exact bytes published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: oracle-local:candidate
          # No layer cache. A mutable cache sitting in the path that determines
          # this image's numbers is not worth a minute of build time when the
          # image's whole claim is that those numbers do not move.
          #
          # This was briefly and wrongly reported as the fix for the
          # reproducibility gate failure. It is not: a cached build passed and a
          # cache-free build failed. See HISTORY.md. Kept on its own merits.
          build-args: |
            IMAGE_TAG=${{ steps.meta.outputs.tag }}
            BUILD_NUMBER=${{ steps.meta.outputs.build_number }}
            BUILD_CREATED=${{ steps.meta.outputs.created }}
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_REPO=${{ github.server_url }}/${{ github.repository }}

      - name: Selftest
        run: docker run --rm oracle-local:candidate Rscript /opt/oracle/selftest.R

      # The downstream invocation contract, asserted rather than assumed.
      #
      # polaris-re runs this image as:
      #   docker run --rm -v <host>:/work -w /work <image> Rscript <file> <args>
      # which depends on three properties of the image that no version number
      # covers. All three passed incidentally for builds 1-7; nothing made them
      # promises. A regression here breaks a consumer with an error that does not
      # name its cause -- a permissions failure on an output write, or a command
      # silently swallowed by an ENTRYPOINT.
      - name: Downstream invocation contract
        run: |
          set -euo pipefail
          fail=0

          ep=$(docker inspect -f '{{json .Config.Entrypoint}}' oracle-local:candidate)
          if [ "$ep" != "null" ] && [ "$ep" != "[]" ]; then
            echo "::error title=ENTRYPOINT added::Config.Entrypoint is $ep. Consumers pass a \
          command (Rscript ...) directly; an entrypoint prefixes or swallows it."
            fail=1
          fi

          user=$(docker inspect -f '{{.Config.User}}' oracle-local:candidate)
          if [ -n "$user" ]; then
            echo "::error title=USER added::Config.User is '$user'. The image must be able to \
          write into a bind-mounted host workspace; a non-root user fails that with a \
          permissions error that looks nothing like its cause."
            fail=1
          fi

          # The real shape, end to end: bind mount, -w /work, Rscript on PATH, and
          # a file that the host can actually read back afterwards.
          probe=$(mktemp -d)
          docker run --rm -v "$probe:/work" -w /work oracle-local:candidate \
            Rscript -e 'writeLines("ok", "contract.txt")'
          if [ "$(cat "$probe/contract.txt" 2>/dev/null)" != "ok" ]; then
            echo "::error title=Cannot write to a bind mount::The consumer's invocation shape \
          did not produce a host-readable file."
            fail=1
          fi
          rm -rf "$probe"

          [ "$fail" -eq 0 ] && echo "invocation contract holds"
          exit "$fail"

      # Also exercises the way polaris-re will consume the image: mount a
      # workspace, write reference outputs into it.
      - name: Generate reference outputs
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm -v "${{ github.workspace }}/out:/work/out" \
            oracle-local:candidate Rscript /opt/oracle/run.R --out /work/out
          ls -la out

      # The oracle's whole promise: identical pinned inputs produce identical
      # numbers across rebuilds. selftest.R checks that two runs inside ONE image
      # agree; only this compares one build against the last. Six builds existed
      # before this gate did and no two had ever been compared.
      - name: Reference outputs must match the previous build
        id: repro
        run: |
          set -euo pipefail
          python3 scripts/check-output-hashes.py out/index.json catalog/expected-hashes.json \
            | tee /tmp/repro.log
          if grep -q '^BASELINE_WRITTEN=1$' /tmp/repro.log; then
            echo "baseline=written" >> "$GITHUB_OUTPUT"
          else
            echo "baseline=matched" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: reference-outputs
          path: out/

      - name: Push
        id: push
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          image='${{ steps.meta.outputs.image }}'
          tag='${{ steps.meta.outputs.tag }}'

          # The immutable tag first, and its digest is the one recorded.
          docker tag oracle-local:candidate "$image:$tag"
          docker push "$image:$tag" | tee /tmp/push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/push.log | tail -1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          # Floating pointers. These DO move by design, which is why they are
          # named so that nobody could mistake one for a pin.
          for f in latest '${{ steps.meta.outputs.float_tag }}'; do
            docker tag oracle-local:candidate "$image:$f"
            docker push "$image:$f" >/dev/null
            echo "moved floating tag $f -> $digest"
          done

      # Read the versions back out of the image that was just pushed, rather
      # than restating what the Dockerfile asked for.
      - name: Read versions from the published image
        id: versions
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          docker run --rm oracle-local:candidate cat /opt/oracle-manifest.json > /tmp/m.json
          cat /tmp/m.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open("/tmp/m.json"))
          p = m.get("packages", {})
          print(f"mgcv={p.get('mgcv','-')}")
          print(f"mboost={p.get('mboost','-')}")
          PY

      # The catalog is generated, never authored. CI writes the record out of
      # the image it just published, so every value in it was read from the
      # installed library rather than asserted by hand.
      - name: Record the build
        # Stated again rather than inherited: this is the step that writes to
        # main, and it should be readable as safe without tracing PUBLISH.
        if: env.PUBLISH == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          m = json.load(open("/tmp/m.json"))
          rec = {
              "build": int("${{ steps.meta.outputs.build_number }}"),
              "tag": "${{ steps.meta.outputs.tag }}",
              "digest": "${{ steps.push.outputs.digest }}",
              "r_version": m.get("r_version"),
              "cran_snapshot": m.get("cran_snapshot"),
              "base_image_digest": m.get("base_image_digest"),
              "built_at": "${{ steps.meta.outputs.created }}",
              "revision": "${{ github.sha }}",
              "workflow_run": int("${{ github.run_id }}"),
              "packages": m.get("packages", {}),
              "packages_absent": m.get("packages_absent"),
              "source": "published",
          }
          json.dump(rec, open("/tmp/record.json", "w"), indent=2, sort_keys=True)
          PY
          python3 scripts/catalog.py add /tmp/record.json
          python3 scripts/catalog.py render > BUILDS.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog BUILDS.md
          git commit -m "catalog: build ${{ steps.meta.outputs.build_number }} (${{ steps.meta.outputs.tag }}) [skip ci]"
          # Rebase rather than force: a concurrent commit to main must not be lost.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          image='${{ steps.meta.outputs.image }}'
          digest='${{ steps.push.outputs.digest }}'
          {
            echo "## Published"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| immutable tag | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| digest | \`$digest\` |"
            echo "| R | \`${{ steps.meta.outputs.r_version }}\` |"
            echo "| CRAN snapshot | \`${{ steps.meta.outputs.snapshot }}\` |"
            echo "| mgcv | \`${{ steps.versions.outputs.mgcv }}\` |"
            echo "| mboost | \`${{ steps.versions.outputs.mboost }}\` |"
            echo
            echo "**Pin by digest.** Tags, even the immutable one, are for humans:"
            echo
            echo '```yaml'
            echo "    container: $image@$digest"
            echo '```'
            echo
            echo "Recorded in \`catalog/builds/${{ steps.meta.outputs.tag }}.json\`;"
            echo "BUILDS.md has been regenerated from it."
          } >> "$GITHUB_STEP_SUMMARY"
