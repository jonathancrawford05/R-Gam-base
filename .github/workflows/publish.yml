name: publish

on:
  push:
    # Feature branches build and selftest but never publish; see the PUBLISH
    # gate below.
    branches: [main, "claude/**"]
    # The publish job appends to BUILDS.md and pushes it to main. Without this
    # the catalog commit would retrigger the workflow, which would publish a new
    # build, which would append another row -- forever.
    paths-ignore: ["BUILDS.md"]
  pull_request:
  # Monthly rebuild. It moves nothing: the base is digest-pinned and CRAN is
  # snapshot-pinned, so this cannot pull in base-OS patches either. What it
  # proves is that the pinned snapshot is still resolvable and the image still
  # builds - early warning that a pin has rotted. Picking up OS patches means
  # bumping BASE_DIGEST, which is a deliberate commit.
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write   # the publish job appends the BUILDS.md row
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a run that might be publishing. Pushing the image tag and
  # appending the BUILDS.md row are two steps with no transaction around them: a
  # cancel landing between them leaves a tag in the registry with no catalog row,
  # which silently consumes a build number and wedges the next publish until
  # someone hand-edits the file. Branch and PR runs publish nothing, so they stay
  # cancellable and keep saving the CI minutes this setting was added for.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    runs-on: ubuntu-latest
    # Publishing requires BOTH a publishing event AND the default branch.
    # Everything else builds and tests without pushing, so a feature branch can
    # prove the image is sound without moving a tag.
    #
    # The ref condition is not decoration. This job pushes image tags and commits
    # BUILDS.md back with `git push origin HEAD:main`. A workflow_dispatch from a
    # feature branch would put HEAD on that branch, and the rebase-and-push would
    # carry every commit on it onto main -- merging unreviewed work with no PR,
    # or, if main is protected, failing AFTER the image tag was already pushed and
    # leaving exactly the tag/catalog desync the guard exists to prevent.
    # `schedule` only ever runs on the default branch, so this costs it nothing.
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main'
        && (github.event_name == 'schedule'
            || github.event_name == 'workflow_dispatch'
            || github.event_name == 'push') }}
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile is the single source of truth for the pinned versions;
      # the workflow reads them rather than restating them, so they cannot drift.
      - name: Resolve image coordinates
        id: meta
        run: |
          set -euo pipefail
          r_version=$(sed -n 's/^ARG R_VERSION=//p' Dockerfile | head -1)
          snapshot=$(sed -n 's/^ARG CRAN_SNAPSHOT=//p' Dockerfile | head -1)
          # GHCR requires a lowercase path; this repository is "R-Gam-base".
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # The build number is what makes a tag unique when the version fields
          # cannot: two builds with the same R and the same snapshot are still two
          # builds. BUILDS.md is the source of truth rather than the registry, so
          # the catalog can never fall behind the tag it describes.
          # Read the table as data. The previous version grepped the whole file
          # for anything tag-shaped, so a sentence in the *what changed* column
          # naming a tag -- which the catalog explicitly invites -- could move
          # the counter. catalog.sh only sees rows whose first cell is a build
          # number.
          last=$(bash scripts/catalog.sh max-build)
          build_number=$(( last + 1 ))
          tag="r${r_version}-cran${snapshot}-b${build_number}"
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          {
            echo "image=$image"
            echo "r_version=$r_version"
            echo "snapshot=$snapshot"
            echo "build_number=$build_number"
            echo "tag=$tag"
            echo "created=$created"
            echo "float_tag=r${r_version}-latest"
          } >> "$GITHUB_OUTPUT"
          echo "resolved build $build_number -> $image:$tag"

      # Log in first: the tag guard must query the registry with credentials, so
      # that an auth failure is a distinguishable error rather than a 401 it
      # might mistake for something else.
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are immutable and never reused. This is FAIL-CLOSED: it publishes
      # only on a definite 404. `docker manifest inspect` was rejected here
      # because it exits non-zero for "absent", "unauthorised", "rate limited"
      # and "network died" alike -- so the one time the registry is unreachable
      # it would report the tag as free and quietly move it.
      - name: Refuse to reuse an existing tag
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Actions runs `run:` under `bash -e`, and `set -uo pipefail` does not
          # clear the inherited -e. Without `set +e` the script's non-zero exit
          # aborts the step here, `rc=$?` never runs, and every message below is
          # dead code: the step still fails, but the operator is told nothing
          # about which failure it was or how to recover.
          set +e
          bash scripts/check-tag-free.sh \
            '${{ steps.meta.outputs.image }}' '${{ steps.meta.outputs.tag }}'
          rc=$?
          set -e
          case "$rc" in
            0)  echo "tag is free; proceeding" ;;
            10) echo "::error title=Tag already exists::${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
          is already published. Tags are immutable and are never re-pointed. Append the missing \
          row to BUILDS.md so the build number advances, then re-run."
                exit 1 ;;
            *)  echo "::error title=Cannot verify tag state::The registry did not give a definite \
          answer for ${{ steps.meta.outputs.tag }}. Refusing to publish: treating an unreachable \
          registry as 'tag is free' is how an immutable tag silently moves."
                exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@v3

      # Build and load locally first. The image is tested before it is pushed,
      # and the bytes that pass the test are the exact bytes published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: oracle-local:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_TAG=${{ steps.meta.outputs.tag }}
            BUILD_NUMBER=${{ steps.meta.outputs.build_number }}
            BUILD_CREATED=${{ steps.meta.outputs.created }}
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_REPO=${{ github.server_url }}/${{ github.repository }}

      - name: Selftest
        run: docker run --rm oracle-local:candidate Rscript /opt/oracle/selftest.R

      # Also exercises the way polaris-re will consume the image: mount a
      # workspace, write reference outputs into it.
      - name: Generate reference outputs
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm -v "${{ github.workspace }}/out:/work/out" \
            oracle-local:candidate Rscript /opt/oracle/run.R --out /work/out
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: reference-outputs
          path: out/

      - name: Push
        id: push
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          image='${{ steps.meta.outputs.image }}'
          tag='${{ steps.meta.outputs.tag }}'

          # The immutable tag first, and its digest is the one recorded.
          docker tag oracle-local:candidate "$image:$tag"
          docker push "$image:$tag" | tee /tmp/push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/push.log | tail -1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          # Floating pointers. These DO move by design, which is why they are
          # named so that nobody could mistake one for a pin.
          for f in latest '${{ steps.meta.outputs.float_tag }}'; do
            docker tag oracle-local:candidate "$image:$f"
            docker push "$image:$f" >/dev/null
            echo "moved floating tag $f -> $digest"
          done

      # Read the versions back out of the image that was just pushed, rather
      # than restating what the Dockerfile asked for.
      - name: Read versions from the published image
        id: versions
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          docker run --rm oracle-local:candidate cat /opt/oracle-manifest.json > /tmp/m.json
          cat /tmp/m.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open("/tmp/m.json"))
          p = m.get("packages", {})
          print(f"mgcv={p.get('mgcv','-')}")
          print(f"mboost={p.get('mboost','-')}")
          PY

      # The catalog is the artifact a consumer actually reads; appending here is
      # what stops it falling behind the registry.
      - name: Append the BUILDS.md row
        # Stated again rather than inherited: this is the step that writes to
        # main, and it should be readable as safe without tracing PUBLISH.
        if: env.PUBLISH == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          row="| ${{ steps.meta.outputs.build_number }} \
          | \`${{ steps.meta.outputs.tag }}\` \
          | \`${{ steps.push.outputs.digest }}\` \
          | ${{ steps.meta.outputs.r_version }} \
          | ${{ steps.meta.outputs.snapshot }} \
          | ${{ steps.versions.outputs.mgcv }} \
          | ${{ steps.versions.outputs.mboost }} \
          | ${{ steps.meta.outputs.created }} \
          | \`${{ github.sha }}\` \
          | _(pending: describe this build)_ |"
          # Insert into the table, not at the end of the file. `>> BUILDS.md`
          # put build 3's row below the notes section, where it rendered as a
          # stray one-row table -- the data was right and the document was
          # wrong, which is a poor property for the artifact consumers read.
          # The marker makes the insertion point explicit and reviewable rather
          # than inferred from "the last line that looks like a row".
          marker='<!-- new build rows are inserted directly above this line -->'
          if ! grep -qF "$marker" BUILDS.md; then
            echo "::error title=Catalog marker missing::BUILDS.md has no insertion marker, \
          so this row has nowhere well-defined to go. Restore the marker line at the end of \
          the Builds table."
            exit 1
          fi
          printf '%s\n' "$(echo "$row" | tr -s ' ')" > /tmp/row.md
          awk -v marker="$marker" 'index($0, marker) { while ((getline line < "/tmp/row.md") > 0) print line } { print }' \
            BUILDS.md > /tmp/BUILDS.md && mv /tmp/BUILDS.md BUILDS.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILDS.md
          git commit -m "catalog: build ${{ steps.meta.outputs.build_number }} (${{ steps.meta.outputs.tag }}) [skip ci]"
          # Rebase rather than force: a concurrent commit to main must not be lost.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          image='${{ steps.meta.outputs.image }}'
          digest='${{ steps.push.outputs.digest }}'
          {
            echo "## Published"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| immutable tag | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| digest | \`$digest\` |"
            echo "| R | \`${{ steps.meta.outputs.r_version }}\` |"
            echo "| CRAN snapshot | \`${{ steps.meta.outputs.snapshot }}\` |"
            echo "| mgcv | \`${{ steps.versions.outputs.mgcv }}\` |"
            echo "| mboost | \`${{ steps.versions.outputs.mboost }}\` |"
            echo
            echo "**Pin by digest.** Tags, even the immutable one, are for humans:"
            echo
            echo '```yaml'
            echo "    container: $image@$digest"
            echo '```'
            echo
            echo "A row has been appended to BUILDS.md. Please replace its"
            echo "_(pending)_ note with a sentence saying what actually changed."
          } >> "$GITHUB_STEP_SUMMARY"
