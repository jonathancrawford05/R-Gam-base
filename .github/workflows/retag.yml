# =============================================================================
# Give an already-published digest an additional immutable tag.
# =============================================================================
# This does NOT rebuild, and it does not create a new manifest either. The tag
# is written by re-PUTting the existing manifest's exact bytes under a new name,
# so the digest is unchanged and anything already validated against it stays
# valid. That is the whole reason this workflow exists rather than a "rebuild
# with the right tag" job: a rebuild would produce different bytes, and a digest
# that a downstream project has recorded as a numerical reference must never be
# invalidated for a naming problem.
#
# It previously used `docker buildx imagetools create`, which turned out to do
# something subtly different -- see scripts/point-tag-at-digest.sh for what and
# why it produced a wrong tag before anyone noticed.
#
# It also prints the image's recorded versions, so a build published before the
# manifest/label policy existed can be CONFIRMED by inspection. Note the ordering:
# the catalog row must already exist before this will run (see the gate below), so
# inspection here verifies a row that was written from the publishing run's logs
# or from `docker run <ref> cat /opt/oracle/manifest.json` locally. Catalog first,
# then tag, then confirm.
#
# Usage: Actions -> "retag" -> Run workflow, supply the digest and the new tag.
# =============================================================================

name: retag

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Existing digest to tag, e.g. sha256:8853bf2b..."
        required: true
        type: string
      tag:
        description: "New immutable tag, e.g. r4.6.1-cran2026-08-01-b2"
        required: true
        type: string
      correct_mispointed:
        description: >-
          Repoint the tag if it exists but resolves to an UNCATALOGUED digest
          (i.e. a failed earlier attempt). Never touches a catalogued build.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  retag:
    name: Retag an existing digest
    runs-on: ubuntu-latest
    steps:
      # Pinned to main, not the dispatched ref. The gate below validates against
      # BUILDS.md, and a dispatch from a stale branch would otherwise check
      # against a stale catalog -- passing a digest that main has never heard of.
      # It also means the guards run main's reviewed copies of the scripts.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve and validate inputs
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          digest='${{ inputs.digest }}'
          tag='${{ inputs.tag }}'

          if ! echo "$digest" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error title=Malformed digest::'$digest' is not a full sha256:<64 hex>. \
          The catalog's primary key is the full digest; an abbreviation is not acceptable here."
            exit 1
          fi
          # Refuse a name that looks specific but is not part of the scheme, and
          # refuse the floating names outright -- those are moved by publish, not here.
          if ! echo "$tag" | grep -qE '^r[0-9]+\.[0-9]+\.[0-9]+-cran[0-9]{4}-[0-9]{2}-[0-9]{2}-b[0-9]+$'; then
            echo "::error title=Tag does not match the scheme::'$tag' must look like \
          r<R>-cran<YYYY-MM-DD>-b<N>, e.g. r4.6.1-cran2026-08-01-b2."
            exit 1
          fi
          # The catalog must already know this digest.
          #
          # publish.yml derives the next build number by grepping BUILDS.md, so a
          # tag minted here and never recorded silently consumes a number: the
          # catalog still tops out at the old value, a later publish derives a
          # number this workflow already used, and the tag guard then blocks
          # publishing until someone hand-edits the file -- with nothing to
          # connect that failure to a retag run from weeks earlier. Requiring the
          # row first keeps the invariant and keeps this workflow free of write
          # access to the repository.
          if ! grep -qF "$digest" BUILDS.md; then
            echo "::error title=Digest is not catalogued::$digest does not appear in \
          BUILDS.md. Append its row first -- the catalog is the source of truth for build \
          numbers, and a tag it does not know about will wedge a later publish."
            exit 1
          fi
          if ! grep -qF "$tag" BUILDS.md; then
            echo "::error title=Tag is not catalogued::BUILDS.md does not mention '$tag'. \
          The row for this digest must name the tag being applied."
            exit 1
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "ref=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "target=$image:$tag" >> "$GITHUB_OUTPUT"

      # Fail-closed, same as publish: nothing proceeds without a definite answer
      # from the registry. Three outcomes are acceptable, and they are different:
      # absent (write it), already correct (nothing to do), and pointing at an
      # uncatalogued digest with correction explicitly requested.
      - name: Decide what to do about an existing tag
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Actions runs `run:` under `bash -e`; `set -uo pipefail` does not clear
          # it, so without this the case below never executes.
          set +e
          current=$(bash scripts/resolve-tag-digest.sh \
            '${{ steps.meta.outputs.image }}' '${{ inputs.tag }}')
          rc=$?
          set -e

          case "$rc" in
            0)
              echo "tag is absent; will create it"
              echo "action=create" >> "$GITHUB_OUTPUT"
              ;;
            10)
              echo "tag currently resolves to $current"
              if [ "$current" = '${{ inputs.digest }}' ]; then
                # Makes a re-run after a partial failure safe, which matters
                # precisely because the failure mode this workflow had left a
                # tag behind.
                echo "already points at the requested digest; nothing to do"
                echo "action=noop" >> "$GITHUB_OUTPUT"
              elif [ '${{ inputs.correct_mispointed }}' != 'true' ]; then
                echo "::error title=Tag already exists::${{ steps.meta.outputs.target }} \
          resolves to $current, not ${{ inputs.digest }}. Tags are immutable and are never \
          re-pointed. If this is the residue of a failed retag, re-run with \
          correct_mispointed=true; that is refused unless $current is absent from BUILDS.md."
                exit 1
              elif grep -qF "$current" BUILDS.md; then
                # The safety property that makes correction acceptable at all:
                # a digest the catalog knows may be cited in a recorded
                # measurement, so its tag is never taken away from it.
                echo "::error title=Refusing to repoint a catalogued digest::$current appears \
          in BUILDS.md, so it may be cited by a downstream measurement. correct_mispointed is \
          only for tags left behind pointing at digests the catalog has never recorded."
                exit 1
              else
                echo "$current is not in BUILDS.md; correcting the tag as requested"
                echo "action=correct" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error title=Cannot verify tag state::Refusing to retag without a definite \
          answer from the registry."
              exit 1
              ;;
          esac

      # Writes the tag by re-PUTting the manifest's exact bytes. The script
      # verifies the fetched bytes hash to the requested digest before writing
      # anything, and fails on any HTTP status it did not expect -- so a missing
      # source digest and an unreachable registry are both reported here rather
      # than surfacing as a bare non-zero exit.
      - name: Apply the tag
        if: steps.plan.outputs.action != 'noop'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/point-tag-at-digest.sh \
            '${{ steps.meta.outputs.image }}' \
            '${{ inputs.digest }}' \
            '${{ inputs.tag }}'

      # Independently, from the registry rather than from the writer. A retag
      # that silently landed on different bytes is exactly the failure that made
      # this workflow's original implementation wrong.
      - name: Confirm the tag resolves to the requested digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          set +e
          got=$(bash scripts/resolve-tag-digest.sh \
            '${{ steps.meta.outputs.image }}' '${{ inputs.tag }}')
          rc=$?
          set -e
          echo "expected ${{ inputs.digest }}"
          echo "got      $got (rc=$rc)"
          if [ "$rc" != "10" ] || [ "$got" != '${{ inputs.digest }}' ]; then
            echo "::error title=Digest mismatch::the tag does not point at the requested digest"
            exit 1
          fi
          echo "confirmed: ${{ steps.meta.outputs.target }} -> $got"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Catalog material for a build that predates the manifest policy.
      - name: Report what is inside this image
        run: |
          set -euo pipefail
          ref='${{ steps.meta.outputs.ref }}'
          # /opt/oracle-manifest.json exists only from build 3 onward. Builds
          # predating it still carry the harness manifest, so try that second --
          # and if neither is present, say so instead of printing an empty block.
          found=""
          for path in /opt/oracle-manifest.json /opt/oracle/manifest.json; do
            if docker run --rm "$ref" test -f "$path" 2>/dev/null; then
              found="$path"; break
            fi
          done

          {
            echo "## Retagged"
            echo
            echo "- image: \`${{ steps.meta.outputs.target }}\`"
            echo "- digest: \`${{ inputs.digest }}\`"
            echo "- action: \`${{ steps.plan.outputs.action }}\`"
            echo
            if [ -n "$found" ]; then
              echo "### Versions, read from the image (\`$found\`)"
              echo
              echo '```json'
              docker run --rm "$ref" cat "$found"
              echo '```'
            else
              echo "### Versions"
              echo
              echo "This image carries neither \`/opt/oracle-manifest.json\` nor"
              echo "\`/opt/oracle/manifest.json\`. It predates both. Record its versions in"
              echo "BUILDS.md from the workflow run that published it, and say so in the row."
            fi
            echo
            echo "### Packages not covered by the older manifest"
            echo
            echo '```'
            docker run --rm "$ref" Rscript -e \
              'for (p in c("MASS","mgcv","mboost")) cat(p,
                 tryCatch(as.character(packageVersion(p)), error = function(e) "absent"), "\n")' \
              || echo "(could not run R in this image)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
