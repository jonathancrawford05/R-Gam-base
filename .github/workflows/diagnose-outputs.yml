# =============================================================================
# TEMPORARY DIAGNOSTIC. Delete once the question below is answered.
# =============================================================================
# The reproducibility gate added in #9 failed on its first real comparison:
# build 7 recorded output hashes da0bafdf/0e3964c7, and every build since
# produces 3ab5ad90/4a89f1e3 -- reproducibly, across two runs.
#
# The only Docker build input that differs between those images is a COMMENT in
# scripts/oracle-manifest.R, in a layer COPYd AFTER the manifest that gets
# embedded in the outputs. That cannot move a number, so one of two things is
# true and reasoning cannot separate them:
#
#   A. the committed baseline was never what build 7's image produces
#      -> the bootstrap in check-output-hashes.py is buggy
#   B. the two images really do differ
#      -> chase it into the layers
#
# So ask build 7's PUBLISHED image, by digest, on today's runner. It publishes
# nothing and changes nothing.
# =============================================================================

name: diagnose-outputs

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diagnose-outputs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      B7: ghcr.io/jonathancrawford05/r-gam-base@sha256:774803b941bb435e4826fcac12dfbc131e94da19428d6c22a825c0edf15be3c8
    steps:
      - uses: actions/checkout@v4

      - name: Host, for the record
        run: |
          echo "nproc: $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          grep -m1 'flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|avx512f)$' | tr '\n' ' ' || true
          echo

      # Twice, into separate directories, from the SAME image. If these two
      # disagree the outputs are not even deterministic within a host, which
      # would be a different and worse finding than either A or B.
      - name: Run build 7's published image twice
        run: |
          set -euo pipefail
          for n in 1 2; do
            mkdir -p "out$n"
            docker run --rm -v "$PWD/out$n:/work/out" "$B7" \
              Rscript /opt/oracle/run.R --out /work/out >/dev/null
          done
          echo "### run 1"; sha256sum out1/*.json | sed 's|out1/||'
          echo "### run 2"; sha256sum out2/*.json | sed 's|out2/||'

      - name: Compare against the committed baseline
        run: |
          set -euo pipefail
          echo "### committed baseline (written by build 7 itself)"
          cat catalog/expected-hashes.json
          echo
          echo "### what build 7's image produces today"
          python3 -c '
import json
idx = json.load(open("out1/index.json"))
for o in idx["outputs"]:
    print(f"  {o[\"path\"]}  {o[\"sha256\"]}")'
          echo
          echo "### verdict"
          python3 - <<'PY'
import json
base = json.load(open("catalog/expected-hashes.json"))
idx  = json.load(open("out1/index.json"))
now  = {o["path"]: o["sha256"] for o in idx["outputs"]}
if now == base:
    print("MATCHES the baseline -> build 7's image is stable; the newer IMAGES differ (case B).")
else:
    print("DIFFERS from the baseline -> build 7's own image no longer reproduces the")
    print("hashes build 7 committed. The baseline is not a property of the image (case A),")
    print("and the gate has been comparing against a fiction.")
    for k in sorted(set(base) | set(now)):
        if base.get(k) != now.get(k):
            print(f"  {k}\n    baseline {base.get(k)}\n    today    {now.get(k)}")
PY

      # If the environment block differs, the cause is provenance, not numerics.
      - name: The embedded environment block
        run: |
          set -euo pipefail
          python3 -c '
import json, glob
p = sorted(g for g in glob.glob("out1/*.json") if not g.endswith("index.json"))[0]
print(json.dumps(json.load(open(p))["environment"], indent=2, sort_keys=True))'
